<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>真的樂團 Real-8bit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
/* 單一深色街機畫面：中央是 384x216 的遊戲畫布（整數倍放大），上方 HUD、下方觸控鍵 */
:root {
  --night: #12163a;      /* 深藍夜色，和像素外框同色系 */
  --ink: #1c2242;        /* 像素外框色 */
  --paper: #f4f1e6;
  --gold: #ffd34d;       /* 金幣 */
  --heart: #ff4f6d;
  --dim: #8a90b4;
  --font-pixel: 'Press Start 2P', 'DotGothic16', ui-monospace, monospace;
  --font-cjk: 'DotGothic16', 'PingFang TC', 'Noto Sans TC', sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--paper); margin: 0;
  font-family: var(--font-cjk);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; overflow: hidden;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
#stage { position: relative; line-height: 0; box-shadow: 0 0 0 4px var(--ink), 0 0 0 8px #2a3070; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* HUD：疊在畫布上方，字用 DOM 畫才清楚 */
#hud { position: absolute; inset: 0 0 auto 0; display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: start; padding: .5em .9em; background: rgba(18, 22, 52, .62);
  border-bottom: 3px solid rgba(18, 22, 52, .85); line-height: 1.25; pointer-events: none;
  font-size: var(--hud); text-shadow: 2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink); }
#hud .l, #hud .r { display: flex; flex-direction: column; gap: .3em; }
#hud .r { align-items: end; }
#hud .c { text-align: center; display: flex; flex-direction: column; gap: .3em; }
#hud .pix { font-family: var(--font-pixel); font-size: .8em; letter-spacing: .04em; }
#hud .title { color: #ffe27a; font-size: 1.05em; }
#hearts { color: var(--heart); letter-spacing: .1em; font-size: .9em; }
#coins::before { content: '♫'; color: var(--gold); margin-right: .3em; font-family: var(--font-cjk); font-size: 1.3em; }

/* 標題與選關、過關畫面 */
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: .9em; background: rgba(12, 14, 40, .82); line-height: 1.3;
  font-size: var(--hud); text-align: center; padding: 1em; box-sizing: border-box; }
.overlay h1 { margin: 0; font-family: var(--font-cjk); font-weight: 400; font-size: 2.6em; letter-spacing: .08em;
  color: var(--paper); text-shadow: 3px 3px 0 var(--ink), 6px 6px 0 #ff4f6d; text-wrap: balance; }
.overlay .sub { font-family: var(--font-pixel); font-size: .75em; color: var(--gold); letter-spacing: .12em; }
.overlay .hint { color: var(--dim); font-size: .8em; }
#picks { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5em; width: 100%; max-width: 46em; }
#picks button { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: .2em;
  padding: .35em .2em .4em; border: 3px solid var(--ink); background: #232a66; color: var(--paper);
  box-shadow: inset 0 -4px 0 #171c4a; }
#picks button:hover, #picks button:focus-visible { background: #34408c; outline: 3px solid var(--gold); outline-offset: 0; }
#picks img { width: 100%; max-width: 100%; aspect-ratio: 84 / 100; object-fit: contain; image-rendering: pixelated; }
#picks .st { font-family: var(--font-pixel); font-size: .55em; color: var(--gold); }
#picks .nm { font-family: var(--font-pixel); font-size: .5em; }
#picks .lm { font-size: .62em; color: var(--dim); min-height: 2.6em; }
.btn { all: unset; cursor: pointer; font-family: var(--font-pixel); font-size: .75em; padding: .8em 1.2em;
  background: var(--heart); color: #fff; border: 3px solid var(--ink); box-shadow: inset 0 -4px 0 #b8304e; }
.btn:focus-visible, .btn:hover { outline: 3px solid var(--gold); }
.big { font-family: var(--font-pixel); font-size: 1.4em; color: var(--gold); text-shadow: 3px 3px 0 var(--ink); }

/* 觸控鍵：只在觸控裝置顯示 */
#pad { display: none; width: 100%; max-width: 640px; justify-content: space-between; margin-top: 14px; gap: 12px; }
#pad .grp { display: flex; gap: 12px; }
#pad button { all: unset; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%;
  background: #232a66; border: 3px solid var(--ink); box-shadow: inset 0 -5px 0 #171c4a; color: var(--paper);
  font-family: var(--font-pixel); font-size: 14px; touch-action: none; }
#pad button.on { background: #34408c; }
#pad #bj { background: var(--heart); box-shadow: inset 0 -5px 0 #b8304e; width: 76px; height: 76px; }
@media (pointer: coarse) { #pad { display: flex; } }
/* 直立手機：選關改排在畫布下方、三欄 */
@media (max-width: 560px) {
  #title { position: static; background: var(--night); padding: 1em 0 .4em; font-size: 12px; }
  #title h1 { font-size: 2em; }
  #picks { grid-template-columns: repeat(3, 1fr); }
  #picks img { max-height: 72px; }
  #title .hint { display: none; }
  body { overflow: auto; justify-content: flex-start; }
}
#mute { position: absolute; right: .6em; bottom: .6em; font-family: var(--font-pixel); font-size: calc(var(--hud) * .6);
  all: unset; cursor: pointer; position: absolute; right: .8em; bottom: .7em; padding: .4em .6em;
  background: rgba(18, 22, 52, .7); border: 2px solid var(--ink); color: var(--paper);
  font-family: var(--font-pixel); font-size: calc(var(--hud) * .55); line-height: 1; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div id="stage">
  <canvas id="cv" width="384" height="216" aria-label="遊戲畫面"></canvas>
  <div id="hud" hidden>
    <div class="l"><span class="pix" id="pname">SUSAN</span><span id="hearts">♥♥♥</span></div>
    <div class="c"><span class="pix" id="sid">STAGE 1-1</span><span class="title" id="stitle">台北 101</span></div>
    <div class="r"><span class="pix" id="coins">×00</span><span class="pix" id="time">TIME 300</span></div>
  </div>
  <div class="overlay" id="title">
    <h1>真的樂團</h1>
    <div class="sub">REAL REAL · 台北六景巡演</div>
    <div id="picks"></div>
    <div class="hint">← → 移動　空白鍵／↑ 跳躍　停下來就會開始演奏　M 靜音</div>
  </div>
  <div class="overlay" id="clear" hidden>
    <div class="big" id="clearText">STAGE CLEAR!</div>
    <div id="clearInfo"></div>
    <button class="btn" id="nextBtn" type="button">下一站</button>
  </div>
  <button id="mute" type="button" hidden>♪ ON</button>
</div>
<div id="pad" aria-hidden="true">
  <div class="grp"><button id="bl" type="button">◀</button><button id="br" type="button">▶</button></div>
  <div class="grp"><button id="bj" type="button">JUMP</button></div>
</div>

<script>
(() => {
'use strict';
const VW = 384, VH = 216, LEVEL = 2400, GROUND_TOP = 168;
const BG_W = 1920, BG_TOP = 60;          // 遠景 5 倍寬、上方多 60 px 天空
const BG_RX = (BG_W - VW) / (LEVEL - VW), BG_RY = .5, CAM_UP = 70;   // 視差比例、鏡頭最多往上 70 px
const STAGES = [
  { id: '1-1', title: '台北 101',         char: 'susan',    name: 'SUSAN',    inst: 'mic',    gy: 192 },
  { id: '1-2', title: '圓山飯店',         char: 'jimmy',    name: 'JIMMY',    inst: 'keytar', gy: 192 },
  { id: '1-3', title: '臺北表演藝術中心', char: 'davidd',   name: 'DAVIDD',   inst: 'bass',   gy: 192 },
  { id: '1-4', title: '臺北流行音樂中心', char: 'raphael',  name: 'RAPHAEL',  inst: 'guitar', gy: 192 },
  { id: '1-5', title: '仙跡岩登山入口',   char: 'freda',    name: 'FREDA',    inst: 'mic',    gy: 192 },
  { id: '1-6', title: '小油坑橋',         char: 'anderson', name: 'ANDERSON', inst: 'snare',  gy: 190 },
];
const FRAMES = ['right_walk1', 'right_walk2', 'right_walk3', 'right_jump',
                'left_walk1', 'left_walk2', 'left_walk3', 'left_jump', 'front_play1', 'front_play2'];
const FOOT = [42, 92];                  // 角色畫格的腳底中心
const PW = 16, PH = 56;                 // 角色碰撞框
const GRAV = 0.42, JUMP = -9.2, ACC = 0.28, MAXV = 2.5, FRIC = 0.22;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);

// ------------------------------------------------------------ 素材
const IMG = {};
function load(key, src) {
  return new Promise(res => { const im = new Image(); im.onload = () => { IMG[key] = im; res(); }; im.onerror = res; im.src = src; });
}
const jobs = [];
STAGES.forEach((s, i) => {
  jobs.push(load('bg' + i, `assets/bg_${i + 1}.png`), load('gr' + i, `assets/ground_${i + 1}.png`));
  FRAMES.forEach(f => jobs.push(load(`${s.char}/${f}`, `assets/chars/${s.char}/${f}.png`)));
});
['brick', 'block', 'block_used', 'coin', 'note', 'bignote', 'enemy_a', 'enemy_b', 'enemy_flat', 'goal']
  .forEach(k => jobs.push(load(k, `assets/${k}.png`)));

// ------------------------------------------------------------ 版面縮放（整數倍，像素才銳利）
function fit() {
  const pad = matchMedia('(pointer: coarse)').matches ? 110 : 24;
  const aw = window.innerWidth - 32, ah = window.innerHeight - pad;
  let s = Math.min(aw / VW, ah / VH);
  s = s >= 1 ? Math.floor(s * 2) / 2 : s;                 // 0.5 倍級距，大螢幕保持銳利
  cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px';
  document.documentElement.style.setProperty('--hud', Math.max(9, Math.round(7.5 * s)) + 'px');
}
addEventListener('resize', fit); fit();

// ------------------------------------------------------------ 聲音（WebAudio 晶片音）
const Audio = (() => {
  let ac = null, master = null, on = true;
  const BPM = 120, STEP = 60 / BPM / 4;                  // 16 分音符
  let nextT = 0, step = 0, riff = null, timer = null;
  const note = n => 440 * Math.pow(2, (n - 69) / 12);
  // 和弦進行 C - Am - F - G，每小節 16 步
  const ROOT = [48, 45, 41, 43];
  const CHORD = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
  const MELODY = [72, -1, 74, 76, -1, 76, 74, 72, 69, -1, 72, 74, -1, 72, 69, 67,
                  65, -1, 69, 72, -1, 74, 72, 69, 67, -1, 71, 74, -1, 79, 77, 74];
  function tone(t, freq, dur, type = 'square', vol = .08, slide = 0) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + .02);
  }
  function noise(t, dur, vol = .12, hp = 1200) {
    const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f).connect(g).connect(master); s.start(t);
  }
  function bgm(t, k) {                                      // 輕量伴奏：大鼓、腳踏鈸、根音
    const bar = Math.floor(k / 16) % 4, s = k % 16;
    if (s % 4 === 0) tone(t, 90, .12, 'sine', .14, .4);
    if (s % 2 === 1) noise(t, .03, .03, 6000);
    if (s % 8 === 0) tone(t, note(ROOT[bar]), .2, 'triangle', .07);
  }
  const RIFFS = {
    mic(t, k) {                                             // 主唱：方波主旋律加顫音
      const n = MELODY[k % 32]; if (n < 0) return;
      const o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
      o.type = 'square'; o.frequency.value = note(n); lfo.frequency.value = 6; lg.gain.value = 5;
      lfo.connect(lg).connect(o.frequency);
      g.gain.setValueAtTime(.06, t); g.gain.setValueAtTime(.06, t + STEP * 1.4); g.gain.exponentialRampToValueAtTime(.0001, t + STEP * 1.9);
      o.connect(g).connect(master); o.start(t); lfo.start(t); o.stop(t + STEP * 2); lfo.stop(t + STEP * 2);
    },
    guitar(t, k) {                                          // 木吉他：三角波刷和弦
      const ch = CHORD[Math.floor(k / 16) % 4], s = k % 16;
      if ([0, 3, 6, 8, 10, 12, 14].includes(s)) ch.forEach((n, i) => tone(t + i * .012, note(n), .35, 'triangle', .05));
    },
    bass(t, k) {                                            // 電 bass：八分音符低音線
      const r = ROOT[Math.floor(k / 16) % 4], s = k % 16;
      const pat = [0, -1, 12, -1, 0, -1, 7, -1, 0, -1, 12, -1, 10, -1, 7, -1];
      if (pat[s] >= 0) tone(t, note(r - 12 + pat[s] + 12), .16, 'square', .07);
    },
    keytar(t, k) {                                          // keytar：鋸齒波十六分琶音
      const ch = CHORD[Math.floor(k / 16) % 4];
      tone(t, note(ch[k % 3] + 12), .1, 'sawtooth', .035);
    },
    snare(t, k) {                                           // 行進小鼓：二四拍加滾奏
      const s = k % 16;
      if (s === 4 || s === 12) noise(t, .16, .16, 900);
      else if (s >= 13) noise(t, .05, .07, 1500);
      else if (s % 2 === 0) noise(t, .03, .04, 2000);
    },
  };
  function tick() {
    while (nextT < ac.currentTime + .12) {
      bgm(nextT, step);
      if (riff) RIFFS[riff](nextT, step);
      nextT += STEP; step++;
    }
  }
  return {
    start() {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = on ? .9 : 0; master.connect(ac.destination);
      }
      ac.resume();
      if (!timer) { nextT = ac.currentTime + .05; timer = setInterval(tick, 25); }
    },
    riff(kind) { riff = kind; },
    toggle() { on = !on; if (master) master.gain.value = on ? .9 : 0; return on; },
    arp(n) {                                                // 頂磚塊：從第 n 級音開始的 do-mi-sol（三度疊三度），每次往上一級
      if (!ac || !on) return;
      const SCALE = [0, 2, 4, 5, 7, 9, 11], t = ac.currentTime;
      const deg = k => { const d = n % 7 + k; return 72 + 12 * Math.floor(d / 7) + SCALE[d % 7]; };
      [0, 2, 4].forEach((k, i) => tone(t + i * .075, note(deg(k)), i === 2 ? .3 : .12, 'square', .07));
    },
    sfx(kind) {
      if (!ac || !on) return;
      const t = ac.currentTime;
      if (kind === 'jump') tone(t, 300, .18, 'square', .06, 2.2);
      if (kind === 'coin') { tone(t, 988, .07, 'square', .06); tone(t + .07, 1319, .22, 'square', .06); }
      if (kind === 'stomp') tone(t, 220, .12, 'square', .08, .4);
      if (kind === 'bump') tone(t, 140, .08, 'triangle', .1);
      if (kind === 'hurt') tone(t, 400, .4, 'sawtooth', .07, .25);
      if (kind === 'clear') [72, 76, 79, 84].forEach((n, i) => tone(t + i * .12, note(n), .3, 'square', .07));
    },
  };
})();

// ------------------------------------------------------------ 關卡產生（每關固定種子）
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function makeLevel(si) {
  const st = STAGES[si], r = rng(7 + si * 101), gy = st.gy;
  const solids = [], coins = [], enemies = [];
  const brick = (x, y) => solids.push({ x, y, w: 16, h: 16, kind: 'brick', used: false, bump: 0 });
  const block = (x, y) => solids.push({ x, y, w: 16, h: 16, kind: 'block', used: false, bump: 0 });
  const coin = (x, y) => coins.push({ x, y, got: false });
  const arc = (x, y, n = 5) => { for (let k = 0; k < n; k++) coin(x + k * 22, y - 10 - Math.round(20 * Math.sin(Math.PI * k / (n - 1)))); };
  const enemy = (x, range) => enemies.push({ x, y: gy - 16, vx: -(0.45 + si * 0.06), x0: x - range, x1: x + range, dead: 0, t: 0 });
  const kinds = ['arc', 'platform', 'enemy', 'stairs', 'high', 'enemy'];
  let x = 340;
  while (x < LEVEL - 380) {
    const k = kinds[Math.floor(r() * (si < 2 ? 5 : kinds.length))];
    if (k === 'arc') { arc(x, gy - 40); x += 170; }
    else if (k === 'platform') {
      const n = 4 + Math.floor(r() * 2);
      for (let i = 0; i < n; i++) (i === 1 ? block : brick)(x + i * 16, gy - 88);
      arc(x + 4, gy - 104, n);
      x += n * 16 + 150;
    } else if (k === 'enemy') { enemy(x + 60, 50 + r() * 30); arc(x + 30, gy - 52, 4); x += 210; }
    else if (k === 'stairs') {
      for (let c = 0; c < 3; c++) for (let h = 0; h <= c; h++) brick(x + c * 16, gy - 16 - h * 16);
      coin(x + 36, gy - 66); coin(x + 52, gy - 74);
      if (si >= 3) enemy(x + 130, 30);
      x += 200;
    } else if (k === 'high') {
      for (let i = 0; i < 3; i++) brick(x + i * 16, gy - 88);
      for (let i = 0; i < 3; i++) (i === 2 ? block : brick)(x + 76 + i * 16, gy - 136);
      arc(x + 78, gy - 152, 3);
      x += 230;
    }
  }
  return { solids, coins, enemies, goal: { x: LEVEL - 170, y: gy - 96, w: 24, h: 96 } };
}

// ------------------------------------------------------------ 遊戲狀態
let S = null, mode = 'title', camX = 0, camY = 0, frame = 0;
const keys = { l: false, r: false, j: false };
let jumpHeld = false;
const parts = [];                     // 飛起來的音符、金幣

function startStage(si) {
  const st = STAGES[si];
  S = { si, st, lv: makeLevel(si), x: 60, y: st.gy, vx: 0, vy: 0, face: 'right', ground: true,
        hearts: 3, coins: 0, time: 300, still: 0, playing: false, inv: 0, dist: 0, clear: 0, scale: 0 };
  parts.length = 0; camX = 0; camY = 0; mode = 'play';
  $('title').hidden = true; $('clear').hidden = true; $('hud').hidden = false; $('mute').hidden = false;
  $('pname').textContent = st.name; $('sid').textContent = 'STAGE ' + st.id; $('stitle').textContent = st.title;
  hud();
}

function hud() {
  if (!S) return;
  $('hearts').textContent = '♥'.repeat(S.hearts) + '♡'.repeat(3 - S.hearts);
  $('coins').textContent = '×' + String(S.coins).padStart(2, '0');
  $('time').textContent = 'TIME ' + S.time;
}

function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function box() { return { x: S.x - PW / 2, y: S.y - PH, w: PW, h: PH }; }

function hurt() {
  if (S.inv > 0) return;
  S.hearts--; S.inv = 90; Audio.sfx('hurt'); S.vy = -5; hud();
  if (S.hearts <= 0) gameOver('沒力氣了…');
}

function gameOver(msg) {
  mode = 'over'; Audio.riff(null);
  $('clearText').textContent = 'GAME OVER';
  $('clearInfo').textContent = msg;
  $('nextBtn').textContent = '再試一次';
  $('nextBtn').onclick = () => startStage(S.si);
  $('clear').hidden = false; $('nextBtn').focus();
}

function stageClear() {
  mode = 'clear'; Audio.sfx('clear');
  const bonus = Math.floor(S.time / 10);
  const last = S.si === STAGES.length - 1;
  $('clearText').textContent = last ? '巡演完成！' : 'STAGE CLEAR!';
  $('clearInfo').textContent = `${S.st.name} 收集 ${S.coins} 個音符　剩餘時間 ${S.time}　加分 ${bonus}`;
  $('nextBtn').textContent = last ? '回到選單' : '下一站：' + STAGES[S.si + 1].title;
  $('nextBtn').onclick = () => last ? showTitle() : startStage(S.si + 1);
  setTimeout(() => { if (mode === 'clear') { $('clear').hidden = false; $('nextBtn').focus(); } }, 1600);
}

function showTitle() {
  mode = 'title'; S = null; Audio.riff(null);
  $('title').hidden = false; $('clear').hidden = true; $('hud').hidden = true;
}

// ------------------------------------------------------------ 物理
function update() {
  frame++;
  if (!S) return;
  const st = S.st, lv = S.lv;
  if (mode === 'play') {
    const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    if (dir) { S.vx += dir * ACC; S.face = dir > 0 ? 'right' : 'left'; }
    else { S.vx -= Math.sign(S.vx) * Math.min(Math.abs(S.vx), FRIC); }
    S.vx = Math.max(-MAXV, Math.min(MAXV, S.vx));
    if (keys.j && !jumpHeld && S.ground) { S.vy = JUMP; S.ground = false; Audio.sfx('jump'); }
    if (!keys.j && S.vy < -3) S.vy = -3;              // 放開跳躍鍵就跳得比較低
    jumpHeld = keys.j;
    if (frame % 40 === 0 && S.time > 0) { S.time--; hud(); if (S.time === 0) gameOver('時間到了'); }
  } else if (mode === 'clear') {                      // 過關：自己走上舞台中央
    const tx = lv.goal.x + 44;
    S.vx = S.x < tx - 1 ? 1.2 : 0; S.face = 'right';
  } else { return; }

  S.vy = Math.min(S.vy + GRAV, 9);
  // 水平移動與碰撞
  S.x += S.vx;
  S.x = Math.max(PW / 2, Math.min(LEVEL - PW / 2, S.x));
  let b = box();
  for (const s of lv.solids) if (overlap(b, s)) {
    if (S.vx > 0) S.x = s.x - PW / 2; else if (S.vx < 0) S.x = s.x + s.w + PW / 2;
    S.vx = 0; b = box();
  }
  // 垂直移動與碰撞
  S.y += S.vy; S.ground = false; b = box();
  if (S.y >= st.gy) { S.y = st.gy; S.vy = 0; S.ground = true; b = box(); }
  for (const s of lv.solids) if (overlap(b, s)) {
    if (S.vy > 0) { S.y = s.y; S.vy = 0; S.ground = true; }
    else if (S.vy < 0) {
      S.y = s.y + s.h + PH; S.vy = 1;
      if (!s.used) {                                    // 頂磚塊或音箱：頂出一個音符，音效是 do-mi-sol 琶音，每頂一次往上一個音階
        s.used = true; s.bump = 8; S.coins++; hud(); Audio.arp(S.scale++);
        parts.push({ kind: 'bignote', x: s.x - 1, y: s.y - 22, vy: -4.5, life: 34 });
      } else { s.bump = 6; Audio.sfx('bump'); }
    }
    b = box();
  }
  S.dist += Math.abs(S.vx);
  if (S.inv > 0) S.inv--;

  // 停下來：轉正面演奏
  const idle = S.ground && Math.abs(S.vx) < .05 && !keys.l && !keys.r && !keys.j;
  S.still = idle ? S.still + 1 : 0;
  const playing = S.still > 28 || (mode === 'clear' && Math.abs(S.vx) < .05);
  if (playing !== S.playing) { S.playing = playing; Audio.riff(playing ? st.inst : null); }
  if (S.playing && frame % 22 === 0)
    parts.push({ kind: 'note', x: S.x + (Math.random() * 24 - 12), y: S.y - 70, vy: -.6, life: 60, float: true });

  // 收集物
  for (const c of lv.coins) if (!c.got && overlap(b, { x: c.x, y: c.y, w: 18, h: 22 })) {
    c.got = true; S.coins++; hud(); Audio.sfx('coin');
  }
  // 敵人
  for (const e of lv.enemies) {
    if (e.dead) { e.dead++; continue; }
    e.t++; e.x += e.vx;
    if (e.x < e.x0 || e.x > e.x1) e.vx *= -1;
    for (const s of lv.solids) if (overlap({ x: e.x, y: e.y, w: 18, h: 16 }, s)) { e.vx *= -1; e.x += e.vx * 2; }
    const eb = { x: e.x + 1, y: e.y + 3, w: 16, h: 13 };
    if (mode === 'play' && overlap(b, eb)) {
      if (S.vy > 0 && S.y - S.vy <= e.y + 8) { e.dead = 1; S.vy = -6; Audio.sfx('stomp'); S.coins++; hud(); }
      else hurt();
    }
  }
  // 終點
  if (mode === 'play' && overlap(b, lv.goal)) stageClear();

  for (const p of parts) { p.y += p.vy; if (!p.float) p.vy += .3; p.life--; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  for (const s of lv.solids) if (s.bump > 0) s.bump--;

  camX = Math.max(0, Math.min(LEVEL - VW, S.x - 150));
  const ty = Math.max(-CAM_UP, Math.min(0, S.y - 120));   // 跳高或站上高台時鏡頭往上
  camY += (ty - camY) * .12;
}

// ------------------------------------------------------------ 繪製
function draw() {
  ctx.clearRect(0, 0, VW, VH);
  const si = S ? S.si : Math.floor(frame / 240) % STAGES.length;
  const cx = S ? Math.round(camX) : (frame * .5) % (LEVEL - VW);
  const oy = S ? Math.round(-camY) : 0;              // 鏡頭上移時整個世界往下畫
  const bg = IMG['bg' + si];                          // 遠景：左右、上下都用較慢的視差
  if (bg) ctx.drawImage(bg, -Math.round(cx * BG_RX), -BG_TOP + Math.round(oy * BG_RY));
  const gr = IMG['gr' + si];
  if (gr) ctx.drawImage(gr, -cx, GROUND_TOP + oy);
  if (!S) return;
  const lv = S.lv;
  const X = x => Math.round(x - cx), Y = y => Math.round(y) + oy;
  if (IMG.goal) ctx.drawImage(IMG.goal, X(lv.goal.x), Y(lv.goal.y));
  for (const s of lv.solids) {
    if (s.x + 16 < cx || s.x > cx + VW) continue;
    const im = s.kind === 'brick' ? IMG.brick : (s.used ? IMG.block_used : IMG.block);
    const dy = s.bump > 0 ? -Math.round(Math.sin(s.bump / 8 * Math.PI) * 4) : 0;
    ctx.drawImage(im, X(s.x), Y(s.y) + dy);
  }
  for (const c of lv.coins) if (!c.got) {
    const bob = Math.round(Math.sin((frame + c.x) / 14) * 1.5);
    ctx.drawImage(IMG.bignote, X(c.x), Y(c.y) + bob);
  }
  for (const e of lv.enemies) {
    if (e.dead > 30) continue;
    const im = e.dead ? IMG.enemy_flat : (Math.floor(e.t / 12) % 2 ? IMG.enemy_b : IMG.enemy_a);
    ctx.save();
    if (e.vx > 0 && !e.dead) { ctx.translate(X(e.x) + 18, Y(e.y)); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0); }
    else ctx.drawImage(im, X(e.x), Y(e.y));
    ctx.restore();
  }
  // 角色
  let f;
  if (S.playing) f = 'front_play' + (Math.floor(frame / 12) % 2 + 1);
  else if (!S.ground) f = S.face + '_jump';
  else if (Math.abs(S.vx) > .1) f = S.face + '_walk' + [1, 2, 3, 2][Math.floor(S.dist / 7) % 4];
  else f = S.face + '_walk1';
  const im = IMG[`${S.st.char}/${f}`];
  if (im && !(S.inv > 0 && Math.floor(S.inv / 4) % 2)) {
    if (S.ground) {
      ctx.fillStyle = 'rgba(20,24,50,.35)';
      ctx.beginPath(); ctx.ellipse(X(S.x), Y(S.y), 10, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.drawImage(im, X(S.x) - FOOT[0], Y(S.y) - FOOT[1]);
  }
  for (const p of parts) {
    const pim = IMG[p.kind] || IMG.note;
    ctx.globalAlpha = p.float ? Math.min(1, p.life / 20) : 1;
    ctx.drawImage(pim, X(p.x), Y(p.y));
    ctx.globalAlpha = 1;
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// ------------------------------------------------------------ 輸入
const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'j', KeyW: 'j', Space: 'j', KeyZ: 'j' };
addEventListener('keydown', e => {
  if (e.code === 'KeyM') { $('mute').textContent = Audio.toggle() ? '♪ ON' : '♪ OFF'; return; }
  const k = KEYMAP[e.code];
  if (k && mode === 'play') { keys[k] = true; e.preventDefault(); }
  if ((e.code === 'Enter' || e.code === 'Space') && !$('clear').hidden) { e.preventDefault(); $('nextBtn').click(); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { keys.l = keys.r = keys.j = false; });
[['bl', 'l'], ['br', 'r'], ['bj', 'j']].forEach(([id, k]) => {
  const el = $(id);
  const on = e => { e.preventDefault(); keys[k] = true; el.classList.add('on'); Audio.start(); };
  const off = e => { e.preventDefault(); keys[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
});
$('mute').addEventListener('click', () => { $('mute').textContent = Audio.toggle() ? '♪ ON' : '♪ OFF'; });

// 選關：每一站一張卡，顯示團員與地標
const picks = $('picks');
STAGES.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.id = 'pick' + i;
  b.innerHTML = `<span class="st">${s.id}</span><img alt="" src="assets/chars/${s.char}/front_play1.png"><span class="nm">${s.name}</span><span class="lm">${s.title}</span>`;
  b.addEventListener('click', () => { Audio.start(); startStage(i); });
  picks.appendChild(b);
});

const boot = () => Promise.all(jobs).then(() => requestAnimationFrame(loop));
window.claude?.hot?.snapshot?.(() => ({ stage: S ? S.si : null }));
const start = data => { boot(); if (data && data.stage != null) startStage(data.stage); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
